[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-metering-platform"
version = "0.1.0"
description = "Auditable usage metering, rating, invoicing, ledger, and reconciliation pipeline"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
metering-pipeline = "monetization_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
